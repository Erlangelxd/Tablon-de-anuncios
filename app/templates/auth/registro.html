{% extends "base.html" %}

{% block titulo %}Registro de usuario{% endblock %}

{% block contenido %}
<section class="seccion-auth">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="card tarjeta-auth">
                    <div class="card-body p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <span class="icono-registro"><i class="bi bi-person-plus"></i></span>
                            <h1 class="h3 fw-bold mt-3 mb-1">Crear una cuenta</h1>
                            <p class="text-secondary mb-0">Completa tus datos para unirte al tablón de anuncios.</p>
                        </div>
                        <form method="post" novalidate>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label" for="nombre">Nombre completo</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" value="{{ datos.nombre }}" placeholder="Ej. Ana Pérez" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="username">Nombre de usuario</label>
                                    <input type="text" class="form-control" id="username" name="username" value="{{ datos.username }}" placeholder="anaperez" autocomplete="username" required>
                                    <div class="form-text">Mínimo 3 caracteres, sin espacios.</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="email">Correo electrónico</label>
                                    <input type="email" class="form-control" id="email" name="email" value="{{ datos.email }}" placeholder="ana@correo.com" autocomplete="email" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="password">Contraseña</label>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="confirmar">Confirmar contraseña</label>
                                    <input type="password" class="form-control" id="confirmar" name="confirmar" placeholder="Repite la contraseña" autocomplete="new-password" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 mt-4">
                                <i class="bi bi-check2-circle me-2"></i>Crear cuenta
                            </button>
                        </form>
                        <p class="text-center text-secondary small mt-4 mb-0">
                            ¿Ya tienes una cuenta?
                            <a href="{{ url_for('auth.login') }}" class="fw-semibold text-decoration-none">Inicia sesión</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
