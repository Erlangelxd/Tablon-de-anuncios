{% macro tarjeta(anuncio) %}
<article class="card tarjeta-anuncio h-100">
    <div class="card-body d-flex flex-column p-4">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
            <span class="badge categoria-badge">{{ anuncio.categoria.nombre }}</span>
            {% if not anuncio.activo %}
            <span class="badge text-bg-secondary">Inactivo</span>
            {% endif %}
        </div>
        <h3 class="h5 card-title mb-2">
            <a href="{{ url_for('anuncios.detalle', anuncio_id=anuncio.id) }}" class="enlace-tarjeta">
                {{ anuncio.titulo }}
            </a>
        </h3>
        <p class="card-text text-secondary small flex-grow-1">{{ anuncio.resumen }}</p>
        <div class="d-flex flex-wrap justify-content-between gap-2 small text-muted border-top pt-3 mt-3">
            <span><i class="bi bi-person-circle me-1"></i>{{ anuncio.autor.nombre }}</span>
            <span><i class="bi bi-calendar3 me-1"></i>{{ anuncio.fecha_publicacion.strftime("%d/%m/%Y") }}</span>
        </div>
    </div>
</article>
{% endmacro %}
