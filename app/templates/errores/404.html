{% extends "base.html" %}

{% block titulo %}Página no encontrada{% endblock %}

{% block contenido %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card formulario-card text-center">
                <div class="card-body p-5">
                    <span class="codigo-error">404</span>
                    <h1 class="h3 fw-bold mt-3">Página no encontrada</h1>
                    <p class="text-secondary mb-4">El recurso que buscas no existe o fue eliminado.</p>
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                            <i class="bi bi-house me-2"></i>Volver al inicio
                        </a>
                        <a href="{{ url_for('anuncios.lista') }}" class="btn btn-outline-secondary">Ver anuncios</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
